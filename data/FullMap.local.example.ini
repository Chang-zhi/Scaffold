; Copy these keys into RA2MD.ini [Scaffold] on the local computer.
; Restart the game after editing. These settings do not change map/game rules.
[Scaffold]

; Map source: no = custom high-resolution terrain (default).
; yes = enlarge the game's native radar image. The sources never mix.
; Icon scaling / important-object overlays / shroud opacity below apply to custom mode.
FullMap.UseNativeRadar=no

; Shroud: opaque by default. Opacity takes effect only when TransparentShroud=yes.
; Opacity range 0..100: 100 = black, 0 = terrain fully bright.
; Logical visibility is always respected: hidden objects/tooltips stay hidden.
FullMap.TransparentShroud=no
FullMap.ShroudOpacity=80

; Unit and important-object marker sizes. IconScale range 0.5..3.0.
FullMap.ScaleIconsWithZoom=yes
FullMap.IconScale=1.0

; Important objects: SpawnsTiberium terrain and [AI] NeutralTechBuildings types.
FullMap.ShowOreSpawners=yes
FullMap.ShowTechBuildings=yes
FullMap.ShowBuildingLabels=yes
FullMap.ShowHealthBars=yes

; Connected currently visible ore/gems; diagonal neighbors belong to one deposit.
; FA2sp multi-selection formula: sum(OverlayData * resource Value), with no +1.
; Each connected cell is counted once. Hidden cells are not included.
FullMap.ShowOreValue=yes
FullMap.HighlightOre=yes

; Button zoom anchors at the map display center; Ctrl+wheel anchors at the pointer.
; ZoomStep range 1.05..2.0, MaxZoom range 2..16 (also limited by canvas size).
FullMap.ZoomStep=1.5
FullMap.MaxZoom=16
FullMap.LeftDragPan=yes

; Show player annotations in the normal tactical view as well as in FullMap.
; FullMapMarksInWorld is still accepted when this new key is absent.
FullMap.MarksInWorld=yes
