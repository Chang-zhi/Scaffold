; Scaffold 完整配置示例
; ================================================================
; 本文件汇总 Scaffold 的所有新增配置键，方便用户查阅和复制。
; 它不是一个可以直接整体覆盖的 INI 文件。
; 未填写的键使用程序默认值。yes/no 可替换为 true/false。
;
; 详细内容请见说明文档。
; ================================================================
; rulesmd.ini / 地图 INI：[General]
; ================================================================
[General]
; 是否启用选择/命令队列扩展（默认 no）。关闭时相关钩子直接回原版，
SelectionQueue.Extend=no
; 仅在 SelectionQueue.Extend=yes 时生效：同时选中数量上限。
; 默认 0：不限制；正数如 2048；负数按 0 处理。
SelectionLimit=0
; 混乱恢复后是否清除当前攻击目标（默认 false）
BerzerkRestoreClearTarget=false
; 路径点文本框在黑幕中是否显示（默认 yes）
ShowTextBoxInShroud.Waypoint=yes
; 单位文本框在黑幕中是否显示（默认 yes）
ShowTextBoxInShroud.Techno=yes
; 是否允许维修盟友建筑（默认 yes）
AllowRepairAlliedBuildings=yes
; 终止命令后是否允许继续追加规划路径点（默认 no）
AllowPlanningAfterTerminalCommand=no
; 磁电武器释放单位后是否恢复被吸取前的目标与目的地（默认 no）
LocomotorRestoreTask=no
; 可收起建筑的基地节点是否按单位数量判定（默认 false）
BaseNodeUseDeployableCount=false
; Auto_passengers_load 自动招募附近单位的半径，单位为格（默认 10.0）
Command.RecruitRange=10.0

; ================================================================
; 是否启用全屏战术地图开关（默认 yes）
FullMap.Enabled=true
; 本局玩家标记数量上限（默认 200，最大 200）
FullMap.MaxMarks=200

; rulesmd.ini / 地图 INI：[WarheadType]
; ================================================================
[WarheadType]
; 缩短混乱时间的帧数，负值则延长（默认 0）
BerserkReduce=0
; 同一目标是否只允许一个单位锁定（默认 false）
Temporal.Exclusive=false
; 启用范围冻结（默认 false）
TemporalAOE.Enable=false
; 范围冻结半径，单位为格（默认 2.0）
TemporalAOE.CellSpread=2.0
; 副目标冻结时间权重（默认 1.0，可填负值）
TemporalAOE.SecondaryWeight=1.0
; 是否连友军一起冻结（默认 false）
TemporalAOE.AffectsAllies=false
; 是否影响空中单位（默认 false）
TemporalAOE.AffectsAirborne=false
; 冻结圆心是否取攻击者而不是主目标（默认 false）
TemporalAOE.CenterOnAttacker=false

; ================================================================
; rulesmd.ini / 地图 INI：[TechnoType]
; 下面的键写在具体科技类型段，例如 [MTNK]、[CLEG]。
; ================================================================
; 示例科技类型段：实际使用时把段名改成 MTNK、CLEG 等科技类型 ID。
[YourTechnoType]
; AI 单位自动进入游猎状态（默认 false）
AutoHunt=false
; AI 控制时能否被其他单位选为攻击目标（默认 true）
LegalTargetWhenAIOwner=true
; 索敌模式：None / LowHealth / FullHealth / Count（默认 None）
SmartVHPScan=None
; 同一目标最多几个单位同时攻击（默认 1）
SmartVHPScan.Count=1
; 达到人数上限后等待的帧数（默认 0）
SmartVHPScan.CountIdleFrames=0
; 索敌偏好强度（默认 2.0）
SmartVHPScan.Bias=2.0
; 血量未知目标的分值倍数（默认 1.0）
SmartVHPScan.UnknownFactor=1.0
; 低于该血量比例的目标不攻击，0 表示关闭（默认 0.0）
SmartVHPScan.ExcludeFraction=0.0
; 等效伤害，0 表示使用武器自身伤害（默认 0）
SmartVHPScan.Damage=0
; 允许火力溢出比例（默认 0.25）
SmartVHPScan.Overflow=0.25
; 换目标门槛倍数，越大越不容易换目标（默认 1.25）
SmartVHPScan.SwitchThreshold=1.25
; 飞行中的弹药是否算作已投入火力（默认 true）
SmartVHPScan.IncludeInflight=true
; 是否启用部署超时空力场（默认 no）
DeployWarp.Enable=no
; 力场半径，单位为格（默认 3.0）
DeployWarp.Range=3.0
; 是否保护盟友（默认 yes）
DeployWarp.AffectsAllies=yes
; 是否纳入敌军（默认 no）
DeployWarp.AffectsEnemies=no
; 是否影响空中单位（默认 no）
DeployWarp.AffectsAirborne=no
; 该单位的载员是否自动加入载具小队（默认 no）
PassengersJoinTeam=no
; 小地图动画类型名，留空表示不启用
RadarAnim=
; 是否在黑幕中显示小地图动画（默认 no）
RadarAnim.ShowInShroud=no

; 示例：超时空兵只允许一个单位攻击同一目标。
[CLEG]
SmartVHPScan=Count
SmartVHPScan.Count=1

; 示例：尤里优先控制满血目标。
[YURI]
SmartVHPScan=FullHealth
SmartVHPScan.Damage=999

; 示例：天启坦克优先处理满血目标。
[APOC]
SmartVHPScan=FullHealth

; ================================================================
; rulesmd.ini / 地图 INI：[TeamType]
; ================================================================
; 示例小队段：实际使用时把段名改成小队类型 ID。
[YourTeamType]
; 小队小地图动画类型名（默认无）
RadarAnim=
; 是否在黑幕中显示（默认 no）
RadarAnim.ShowInShroud=no
; 显示模式：Center / EachMember（默认 Center）
RadarAnim.Mode=Center

; ================================================================
; rulesmd.ini / 地图 INI：[Country House]
; ================================================================
[Country House]
; AI 评估基地节点时是否计入所有所属方建筑（默认 false）
BaseNodeCrossOwners=false
; 池名相同的所属方共用资金；留空表示不加入资金池
SharedMoneyPool=

; ================================================================
; rulesmd.ini / 地图 INI：[ChoiceBoxTypes]
; ================================================================
[ChoiceBoxTypes]
0=MyChoiceBox

[MyChoiceBox]
; 最大像素宽度（默认 250）
MaxWidth=250
; 黑色背景不透明度，0~100（默认 75）
BackgroundOpacity=75
; 文字与边框颜色（默认 255,215,0）
Color=255,215,0
; 显示帧数，-1 表示无限（默认 -1）
Duration=-1
; CSF 标签：标题（默认无）
Title=
; 标题是否居中（默认 no）
Title.Center=no
; CSF 标签：描述（默认无）
Description=
; 按钮数量（默认 0）
Button.Count=0
; 按钮布局：Horizontal / Vertical（默认 Horizontal）
Button.Layout=Horizontal
; 按钮模式：Normal / Bounce（默认 Normal）
Button.Mode=Normal
; 固定按钮宽度，0 表示自适应（默认 0）
Button.Width=0
; 固定按钮高度，0 表示自适应（默认 0）
Button.Height=0
; 第 1 个按钮的 CSF 标签
Button.Text1=
; 第 2 个按钮的 CSF 标签
Button.Text2=
; 继续增加按钮时依次使用 Button.Text3、Button.Text4……

; ================================================================
; rulesmd.ini / 地图 INI：[AITargetTypes]
; ================================================================
[AITargetTypes]
; 每项为科技类型 ID 列表，逗号分隔；索引由触发动作引用。
0=MTNK,FV
1=APOC,HTNK

; ================================================================
; rulesmd.ini / 地图 INI：[TextBoxTypes]
; ================================================================
[TextBoxTypes]
0=FirstBoxType
1=YourBoxType

[YourBoxType]
; 最大像素宽度，1~1000（默认 250）
MaxWidth=250
; 背景不透明度，0~100（默认 75）
BackgroundOpacity=75
; 文字与边框颜色（默认 255,215,0）
Color=255,215,0
; 自动移除帧数，-1 表示无限（默认 -1）
Duration=-1

; ================================================================
; ra2md.ini：[Scaffold]
; 本段是本机设置，只影响当前电脑的显示、输入和性能日志。
; ================================================================
[Scaffold]
; 单人任务中能否用 Tab 重新打开任务简报（默认 false）
AllowTabBriefingInSinglePlayer=false
; CSF 文本是否保留多空格（默认 false）
PreserveCSFSpaces=false

; FullMap 性能日志
FullMap.PerformanceLogging=no
FullMap.PerformanceInterval=2000
FullMap.SlowFrameThreshold=20
; 实验性 OpenGL 缩放，默认关闭
FullMap.GPUScaling=no
; no=FullMap 高清地形，yes=原版雷达放大
FullMap.UseNativeRadar=no
; 迷雾显示
FullMap.TransparentShroud=no
FullMap.ShroudOpacity=80
; 单位图标和大地图上的小地图动画标记；动画图像最长边上限为 192 像素
FullMap.ScaleIconsWithZoom=yes
FullMap.IconScale=1.0
; 重要对象
FullMap.ShowOreSpawners=yes
FullMap.ShowTechBuildings=yes
FullMap.ShowBuildingLabels=yes
FullMap.ShowHealthBars=yes
; 矿区信息
FullMap.ShowOreValue=yes
FullMap.HighlightOre=yes
; 缩放与拖动
FullMap.ZoomStep=1.5
FullMap.MaxZoom=16
FullMap.LeftDragPan=yes
; 是否在原版战术视野中显示 FullMap 标记
FullMap.MarksInWorld=yes

; ================================================================
; 地图 INI：[TriggerGroups]
; ================================================================
[TriggerGroups]
; 触发组索引对应触发组名称。
; 下为示例:
0=FirstTriggerGroup
1=YourTriggerGroup

[YourTriggerGroup]
; 键名可以任意，值为触发 ID。
; 下为示例:
0=01000004
1=01000007
2=01000008
