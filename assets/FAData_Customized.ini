5500=5500 - 分布式装载入运输载具 (Scaffold),0,0,0,小队成员按距离分配到各载具，全员上车后继续执行下一条脚本。不会出现原版脚本 14 的问题：不会只认最后一个载具、不会不考虑 SizeLimit、不会不考虑剩余空间导致卡死。(Scaffold)
5501=5501 - 开始路径可视化 (Scaffold),0,0,0,将当前小队所有成员注册到路径可视化系统。(Scaffold)
5502=5502 - 停止路径可视化 (Scaffold),0,0,0,将当前小队所有成员从路径可视化系统中移除。(Scaffold)
5503=5503 - 分散攻击 (Scaffold),200,0,1,将小队成员均分为若干组，每组锁定一个目标协同攻击，不同组攻击不同目标。当地图上不再有敌人或敌人均无法到达时，执行下一条脚本。参数为分组数。(Scaffold)
5504=5504 - 巡逻到敌方建筑物附近 (Scaffold),16,0,1,巡逻到指定类型的敌方建筑，参数为建筑索引+系数。(Scaffold)
5505=5505 - 巡逻到敌方基地集结点 (Scaffold),0,0,0,小队成员移动攻击到敌方基地集结点，会积极攻击射程内的敌人。(Scaffold)
5506=5506 - 巡逻到己方建筑物附近 (Scaffold),16,0,1,巡逻到指定类型的己方建筑，参数为建筑索引+系数。(Scaffold)
5507=5507 - 巡逻到己方基地集结点 (Scaffold),0,0,0,小队成员移动攻击到己方基地集结点，会积极攻击射程内的敌人。(Scaffold)
5508=5508 - 分散攻击-(AITargetTypes) (Scaffold),201,0,1,将小队成员均分为若干组，每组锁定 [AITargetTypes] 指定索引列表中的一个目标协同攻击，不同组攻击不同目标。(Scaffold)
5509=5509 - 施加AE (Scaffold 和 Phobos v0.5-alpha+),202,0,1,为当前小队全体成员施加指定的 AttachEffect。(Scaffold)
5510=5510 - 移除AE (Scaffold 和 Phobos v0.5-alpha+),203,0,1,移除当前小队全体成员身上的指定 AttachEffect。(Scaffold)
5511=5511 - 清除全部AE (Scaffold 和 Phobos v0.5-alpha+),0,0,0,清除当前小队全体成员身上的全部 AttachEffect。(Scaffold)
5512=5512 - 超时空传送至路径点 (Scaffold),2,0,1,逻辑同原版脚本动作 56／57。若所属方超时空传送充能大于 AIMinorSuperReadyPercent，将等待并请求超时空传送至指定路径点。(Scaffold)

