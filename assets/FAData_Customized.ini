; The FAData_Customized.ini of Scaffold.dll
; v1.0.3.0

; Over 500 values can be used 
; for additional custom dropdowns listing of a section's values.
; Format:
; Index = SectionName, LoadFrom, StrictOrder, ShowUIName, [UseValue]
; Index: the positive of 2nd parameter in [ScriptParams]
; SectionName: section name string
; LoadFrom: which file to load the section from.
; 0 FAData, 1 Rules, 2 Rules + Map, 3 Map, 4 Art, 5 Sound, 6 Theme, 7 AI + Map, 8 EVA, 9 CurrentTheater.
; StrictOrder: Use registry index instead of key value.
; ShowUIName: show UIName, if failed, Name.
; UseValue: use value instead of its key.
